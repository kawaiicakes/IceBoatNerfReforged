# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mod properties
mod_version = 1.1.3-beta
mod_id=iceboatnerf
maven_group = io.github.kawaiicakes.iceboatnerf
mod_name=Ice Boat Nerf
mod_description=Stop boats from gliding at mach 30 on ice. Instead, feel the unsatisfying tactile and auditory assault of wooden paddles scraping against ice.
mod_authors=kawaiicakes
archives_name = iceboatnerf

# Version ranges
minecraft_version_range=[1.20.6,1.21.2)

neoforge_version_range=[21,)

forge_version_range=[50,53)
loader_version_range=[50,53)